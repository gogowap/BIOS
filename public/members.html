<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anggota - Perpustakaan</title>
<script src="/nav.js"></script>
<script>document.write(sharedCSS);</script>
<style>
.alert-banner{padding:12px 16px;border-radius:8px;font-size:.83rem;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.alert-warning{background:rgba(224,90,74,.08);border:1px solid rgba(224,90,74,.2);color:#e87c6e;}
.alert-info{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);color:var(--gold);}
</style>
</head>
<body>
<nav id="mainNav"></nav>
<main>
  <div class="page-header">
    <div class="page-title">Data <span>Anggota</span></div>
    <button class="btn btn-primary" onclick="openModal(null)">+ Tambah Anggota</button>
  </div>

  <div id="warningBanner" style="display:none"></div>

  <div class="toolbar">
    <input type="text" id="searchMember" placeholder="Cari nama atau email..." oninput="filterMembers()">
    <select id="filterStatus" onchange="filterMembers()">
      <option value="">Semua Status</option>
      <option value="active">Aktif</option>
      <option value="suspended">Nonaktif</option>
    </select>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Nama</th><th>Email</th><th>Telepon</th><th>Pinjaman Aktif</th><th>Status</th><th>Aksi</th></tr></thead>
      <tbody id="membersTable"><tr><td colspan="6" class="empty-state"><div class="icon">👥</div>Memuat...</td></tr></tbody>
    </table>
  </div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Tambah Anggota</div>
    <input type="hidden" id="editId">
    <div class="form-row">
      <div class="form-group"><label>Nama Lengkap</label><input id="fName" placeholder="Nama lengkap"></div>
      <div class="form-group"><label>No. Telepon</label><input id="fPhone" placeholder="08123456789"></div>
    </div>
    <div class="form-group"><label>Email</label><input id="fEmail" type="email" placeholder="email@contoh.com"></div>
    <div class="form-group" id="statusField" style="display:none">
      <label>Status</label>
      <select id="fStatus">
        <option value="active">Aktif</option>
        <option value="suspended">Nonaktif / Suspended</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="submitForm()">Simpan</button>
    </div>
  </div>
</div>

<script>
requireAuth();
renderNav('members');
let allMembers=[], allLoans=[];

async function loadData(){
  try{
    const[membersRes, loansRes]=await Promise.all([
      apiCall('GET','/members'),
      apiCall('GET','/loans')
    ]);
    allMembers=membersRes.data;
    allLoans=loansRes.data;
    renderMembers(allMembers);
    checkOverdueWarning();
  }catch(e){toast(e.message,'error');}
}

function getActiveLoanCount(memberId){
  return allLoans.filter(l=>l.member_id===memberId&&(l.status==='borrowed'||l.status==='overdue')).length;
}

function getOverdueLoanCount(memberId){
  return allLoans.filter(l=>l.member_id===memberId&&l.status==='overdue').length;
}

function checkOverdueWarning(){
  // Cari anggota aktif yang punya pinjaman overdue
  const overdueMember=allMembers.filter(m=>m.status==='active'&&getOverdueLoanCount(m.id)>0);
  const banner=document.getElementById('warningBanner');
  if(overdueMember.length>0){
    banner.style.display='block';
    banner.innerHTML=`<div class="alert-banner alert-warning">
      ⚠️ <span>Ada <strong>${overdueMember.length} anggota</strong> dengan pinjaman terlambat. Klik "Auto Nonaktif" untuk menonaktifkan mereka secara otomatis.</span>
      <button class="btn btn-danger btn-sm" onclick="autoSuspend()">Nonaktifkan Sekarang</button>
    </div>`;
  } else {
    banner.style.display='none';
  }
}

function renderMembers(members){
  const tb=document.getElementById('membersTable');
  if(!members.length){tb.innerHTML='<tr><td colspan="6" class="empty-state"><div class="icon">👥</div>Belum ada anggota</td></tr>';return;}
  tb.innerHTML=members.map(m=>{
    const activeLoans=getActiveLoanCount(m.id);
    const overdueLoans=getOverdueLoanCount(m.id);
    return `<tr>
      <td><strong>${m.name}</strong></td>
      <td style="color:var(--text-muted)">${m.email}</td>
      <td style="color:var(--text-muted)">${m.phone||'-'}</td>
      <td>
        ${activeLoans>0?`<span style="color:var(--gold)">${activeLoans} buku</span>`:'<span style="color:var(--text-muted)">-</span>'}
        ${overdueLoans>0?`<span style="color:var(--red);margin-left:6px;font-size:.76rem">(${overdueLoans} terlambat)</span>`:''}
      </td>
      <td><span class="badge badge-${m.status==='active'?'active':'suspended'}">${m.status==='active'?'Aktif':'Nonaktif'}</span></td>
      <td style="display:flex;gap:5px">
        <button class="btn btn-edit btn-sm" onclick="openModal(${m.id})">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteMember(${m.id})">Hapus</button>
      </td>
    </tr>`;
  }).join('');
}

function filterMembers(){
  const q=document.getElementById('searchMember').value.toLowerCase();
  const st=document.getElementById('filterStatus').value;
  renderMembers(allMembers.filter(m=>(!q||(m.name+m.email).toLowerCase().includes(q))&&(!st||m.status===st)));
}

// Auto suspend anggota dengan pinjaman overdue
async function autoSuspend(){
  const targets=allMembers.filter(m=>m.status==='active'&&getOverdueLoanCount(m.id)>0);
  if(!targets.length){toast('Tidak ada anggota yang perlu dinonaktifkan');return;}
  if(!confirm(`Nonaktifkan ${targets.length} anggota dengan pinjaman terlambat?`)) return;
  let success=0;
  for(const m of targets){
    try{
      await apiCall('PUT','/members/'+m.id,{...m,status:'suspended'});
      success++;
    }catch(e){}
  }
  toast(`${success} anggota berhasil dinonaktifkan`);
  loadData();
}

async function suspendMember(id,name){
  if(!confirm(`Nonaktifkan anggota "${name}"?`)) return;
  const m=allMembers.find(x=>x.id===id);
  try{await apiCall('PUT','/members/'+id,{...m,status:'suspended'});toast(`${name} dinonaktifkan`);loadData();}
  catch(e){toast(e.message,'error');}
}

async function activateMember(id,name){
  const m=allMembers.find(x=>x.id===id);
  try{await apiCall('PUT','/members/'+id,{...m,status:'active'});toast(`${name} diaktifkan kembali`);loadData();}
  catch(e){toast(e.message,'error');}
}

function openModal(id){
  document.getElementById('editId').value=id||'';
  if(id){
    const m=allMembers.find(x=>x.id===id);
    document.getElementById('modalTitle').textContent='Edit Anggota';
    document.getElementById('fName').value=m.name;
    document.getElementById('fEmail').value=m.email;
    document.getElementById('fPhone').value=m.phone||'';
    document.getElementById('fStatus').value=m.status;
    document.getElementById('statusField').style.display='block';
  } else {
    document.getElementById('modalTitle').textContent='Tambah Anggota Baru';
    ['fName','fEmail','fPhone'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('statusField').style.display='none';
  }
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}

async function submitForm(){
  const editId=document.getElementById('editId').value;
  const body={name:document.getElementById('fName').value,email:document.getElementById('fEmail').value,phone:document.getElementById('fPhone').value,status:document.getElementById('fStatus').value};
  try{
    if(editId){await apiCall('PUT','/members/'+editId,body);toast('Anggota diupdate!');}
    else{await apiCall('POST','/members',body);toast('Anggota ditambahkan!');}
    closeModal();loadData();
  }catch(e){toast(e.message,'error');}
}

async function deleteMember(id){
  if(!confirm('Hapus anggota ini?')) return;
  try{await apiCall('DELETE','/members/'+id);toast('Anggota dihapus');loadData();}
  catch(e){toast(e.message,'error');}
}

loadData();
</script>
</body>
</html>
