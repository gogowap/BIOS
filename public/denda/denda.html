<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denda - Perpustakaan</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/nav/nav.css">
</head>

<body>

    <nav id="mainNav"></nav>

    <main>
        <div class="page-header">
            <div class="page-title">Riwayat <span>Denda</span></div>
        </div>

        <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr)">
            <div class="stat-card">
                <div class="stat-label">Total Denda Terkumpul</div>
                <div class="stat-value" id="dendaTotal" style="font-size: 1.2rem">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pinjaman Terlambat</div>
                <div class="stat-value" id="dendaOverdue">—</div>
                <div class="stat-sub">belum dikembalikan</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tarif Denda</div>
                <div class="stat-value" style="font-size: 1.2rem; color: var(--red)">Rp 1.000</div>
                <div class="stat-sub">per hari keterlambatan</div>
            </div>
        </div>

        <div class="section-label">Detail Denda</div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Buku</th>
                        <th>Anggota</th>
                        <th>Jatuh Tempo</th>
                        <th>Tgl Kembali</th>
                        <th>Terlambat</th>
                        <th>Denda</th>
                    </tr>
                </thead>
                <tbody id="dendaTable">
                    <tr>
                        <td colspan="6" class="empty-state">
                            <div class="icon">💰</div>Memuat...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="/nav/nav.js"></script>
    <script src="denda.js"></script>
    <script>
        renderNav('denda');
    </script>
</body>

</html>
