<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Perpustakaan</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="autentikasi.css">
</head>
<body>

<div class="wrap">
    <div class="logo">
        <div class="logo-icon">📚</div>
        <div class="logo-title">Perpustakaan</div>
        <div class="logo-sub">Sistem Manajemen Perpustakaan Digital</div>
    </div>
    
    <div class="card">
        <div class="tabs">
            <button class="tab active" id="tabUser" onclick="handleSwitchTab('user')">Pengguna</button>
            <button class="tab" id="tabAdmin" onclick="handleSwitchTab('admin')">Admin</button>
        </div>

        <div class="panel active" id="panel-user-login">
            <div class="alert alert-error" id="userLoginErr"></div>
            <div class="alert alert-success" id="userLoginOk"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginUserEmail" placeholder="email@contoh.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginUserPassword" placeholder="Password">
            </div>
            <button class="btn-submit" onclick="executeLoginUser()">Masuk</button>
            <div class="divider">Belum punya akun? <button class="link-btn" onclick="handleSwitchPanel('register')">Daftar sekarang</button></div>
        </div>

        <div class="panel" id="panel-user-register">
            <div class="alert alert-error" id="registerErr"></div>
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="registerName" placeholder="Nama lengkap kamu">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="registerEmail" placeholder="email@contoh.com">
            </div>
            <div class="form-group">
                <label>No. Telepon <span class="optional">(opsional)</span></label>
                <input type="tel" id="registerPhone" placeholder="08123456789">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="registerPassword" placeholder="Min. 6 karakter">
            </div>
            <button class="btn-submit" onclick="executeRegisterUser()">Daftar Akun</button>
            <div class="divider">Sudah punya akun? <button class="link-btn" onclick="handleSwitchPanel('login')">Masuk di sini</button></div>
        </div>

        <div class="panel" id="panel-admin-login">
            <div class="alert alert-error" id="adminLoginErr"></div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginAdminUsername" placeholder="Username admin">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginAdminPassword" placeholder="Password admin">
            </div>
            <button class="btn-submit" onclick="executeLoginAdmin()">Masuk sebagai Admin</button>
            <div class="hint">Login admin bersifat <strong>private</strong> — hanya untuk pengelola perpustakaan.</div>
        </div>
    </div>
</div>

<script src="autentikasi.js"></script>
</body>
</html>
