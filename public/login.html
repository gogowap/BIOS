<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Perpustakaan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f0e0c;--surface:#1a1814;--surface2:#242018;--border:#2e2a22;--gold:#c9a84c;--gold-light:#e4c170;--text:#f0ead8;--text-muted:#8a8070;--red:#e05a4a;--green:#5a9e6f;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .wrap{width:100%;max-width:400px;padding:24px;}
  .logo{text-align:center;margin-bottom:26px;}
  .logo-icon{font-size:2.8rem;margin-bottom:8px;}
  .logo-title{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--gold);}
  .logo-sub{font-size:.82rem;color:var(--text-muted);margin-top:3px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;}
  .tabs{display:flex;gap:0;margin-bottom:22px;background:var(--surface2);border-radius:8px;padding:3px;}
  .tab{flex:1;padding:8px;border:none;background:transparent;color:var(--text-muted);font-family:'DM Sans',sans-serif;font-size:.84rem;cursor:pointer;border-radius:6px;transition:all .2s;}
  .tab.active{background:var(--gold);color:#0f0e0c;font-weight:600;}
  .panel{display:none;}.panel.active{display:block;}
  .form-group{margin-bottom:13px;}
  .form-group label{display:block;font-size:.74rem;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;}
  .form-group input{width:100%;padding:10px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.88rem;outline:none;transition:border .2s;}
  .form-group input:focus{border-color:var(--gold);}
  .btn-submit{width:100%;padding:11px;background:var(--gold);color:#0f0e0c;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:background .2s;margin-top:4px;}
  .btn-submit:hover{background:var(--gold-light);}
  .alert{padding:10px 14px;border-radius:8px;font-size:.82rem;margin-bottom:13px;display:none;}
  .alert-error{background:rgba(224,90,74,.1);border:1px solid rgba(224,90,74,.3);color:#e87c6e;}
  .alert-success{background:rgba(90,158,111,.1);border:1px solid rgba(90,158,111,.3);color:#7dcb96;}
  .hint{margin-top:13px;padding:10px 13px;background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.15);border-radius:8px;font-size:.78rem;color:var(--text-muted);}
  .hint strong{color:var(--gold);}
  .divider{text-align:center;font-size:.78rem;color:var(--text-muted);margin:13px 0;}
  .link-btn{background:none;border:none;color:var(--gold);font-size:.83rem;cursor:pointer;text-decoration:underline;font-family:'DM Sans',sans-serif;}
  .optional{font-size:.7rem;color:var(--text-muted);margin-left:4px;text-transform:none;letter-spacing:0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">📚</div>
    <div class="logo-title">Perpustakaan</div>
    <div class="logo-sub">Sistem Manajemen Perpustakaan Digital</div>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tabUser" onclick="switchTab('user')">Pengguna</button>
      <button class="tab" id="tabAdmin" onclick="switchTab('admin')">Admin</button>
    </div>

    <!-- USER LOGIN -->
    <div class="panel active" id="panel-user-login">
      <div class="alert alert-error" id="userLoginErr"></div>
      <div class="alert alert-success" id="userLoginOk"></div>
      <div class="form-group"><label>Email</label><input type="email" id="uEmail" placeholder="email@contoh.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="uPass" placeholder="Password"></div>
      <button class="btn-submit" onclick="loginUser()">Masuk</button>
      <div class="divider">Belum punya akun? <button class="link-btn" onclick="switchPanel('register')">Daftar sekarang</button></div>
    </div>

    <!-- USER REGISTER -->
    <div class="panel" id="panel-user-register">
      <div class="alert alert-error" id="regErr"></div>
      <div class="form-group"><label>Nama Lengkap</label><input type="text" id="rName" placeholder="Nama lengkap kamu"></div>
      <div class="form-group"><label>Email</label><input type="email" id="rEmail" placeholder="email@contoh.com"></div>
      <div class="form-group"><label>No. Telepon <span class="optional">(opsional)</span></label><input type="tel" id="rPhone" placeholder="08123456789"></div>
      <div class="form-group"><label>Password</label><input type="password" id="rPass" placeholder="Min. 6 karakter"></div>
      <button class="btn-submit" onclick="registerUser()">Daftar Akun</button>
      <div class="divider">Sudah punya akun? <button class="link-btn" onclick="switchPanel('login')">Masuk di sini</button></div>
    </div>

    <!-- ADMIN LOGIN -->
    <div class="panel" id="panel-admin-login">
      <div class="alert alert-error" id="adminErr"></div>
      <div class="form-group"><label>Username</label><input type="text" id="aUser" placeholder="Username admin"></div>
      <div class="form-group"><label>Password</label><input type="password" id="aPass" placeholder="Password admin"></div>
      <button class="btn-submit" onclick="loginAdmin()">Masuk sebagai Admin</button>
      <div class="hint">Login admin bersifat <strong>private</strong> — hanya untuk pengelola perpustakaan.</div>
    </div>
  </div>
</div>
<script>
if(localStorage.getItem('auth_token')){
  const u=JSON.parse(localStorage.getItem('auth_user')||'{}');
  window.location.href=u.role==='admin'?'/dashboard.html':'/user-home.html';
}

let currentTab='user';

function switchTab(tab){
  currentTab=tab;
  document.getElementById('tabUser').classList.toggle('active',tab==='user');
  document.getElementById('tabAdmin').classList.toggle('active',tab==='admin');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(tab==='admin'?'panel-admin-login':'panel-user-login').classList.add('active');
  clearAlerts();
}

function switchPanel(type){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(type==='register'?'panel-user-register':'panel-user-login').classList.add('active');
  clearAlerts();
}

function clearAlerts(){document.querySelectorAll('.alert').forEach(a=>{a.style.display='none';a.textContent='';}); }
function showError(id,msg){const e=document.getElementById(id);e.textContent=msg;e.style.display='block';}
function showSuccess(id,msg){const e=document.getElementById(id);e.textContent=msg;e.style.display='block';}

async function loginUser(){
  const email=document.getElementById('uEmail').value.trim();
  const password=document.getElementById('uPass').value.trim();
  if(!email||!password){showError('userLoginErr','Email dan password wajib diisi');return;}
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(data.success){
      localStorage.setItem('auth_token',data.token);
      localStorage.setItem('auth_user',JSON.stringify(data.user));
      window.location.href='/user-home.html';
    } else showError('userLoginErr',data.message);
  }catch(e){showError('userLoginErr','Tidak dapat terhubung ke server');}
}

async function registerUser(){
  const name=document.getElementById('rName').value.trim();
  const email=document.getElementById('rEmail').value.trim();
  const phone=document.getElementById('rPhone').value.trim();
  const password=document.getElementById('rPass').value.trim();
  if(!name||!email||!password){showError('regErr','Nama, email, dan password wajib diisi');return;}
  try{
    const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,phone,password})});
    const data=await res.json();
    if(data.success){
      switchPanel('login');
      showSuccess('userLoginOk','Registrasi berhasil! Silakan login.');
      document.getElementById('uEmail').value=email;
    } else showError('regErr',data.message);
  }catch(e){showError('regErr','Tidak dapat terhubung ke server');}
}

async function loginAdmin(){
  const username=document.getElementById('aUser').value.trim();
  const password=document.getElementById('aPass').value.trim();
  if(!username||!password){showError('adminErr','Username dan password wajib diisi');return;}
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await res.json();
    if(data.success){
      localStorage.setItem('auth_token',data.token);
      localStorage.setItem('auth_user',JSON.stringify(data.user));
      window.location.href='/dashboard.html';
    } else showError('adminErr',data.message);
  }catch(e){showError('adminErr','Tidak dapat terhubung ke server');}
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  if(currentTab==='admin') loginAdmin();
  else if(document.getElementById('panel-user-login').classList.contains('active')) loginUser();
  else registerUser();
});
</script>
</body>
</html>
