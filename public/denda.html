<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Denda - Perpustakaan</title>
<script src="/nav.js"></script>
<script>document.write(sharedCSS);</script>
</head>
<body>
<nav id="mainNav"></nav>
<main>
  <div class="page-header">
    <div class="page-title">Riwayat <span>Denda</span></div>
  </div>
  <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat-card"><div class="stat-label">Total Denda Terkumpul</div><div class="stat-value" id="dendaTotal" style="font-size:1.2rem">—</div></div>
    <div class="stat-card"><div class="stat-label">Pinjaman Terlambat</div><div class="stat-value" id="dendaOverdue">—</div><div class="stat-sub">belum dikembalikan</div></div>
    <div class="stat-card"><div class="stat-label">Tarif Denda</div><div class="stat-value" style="font-size:1.2rem;color:var(--red)">Rp 1.000</div><div class="stat-sub">per hari keterlambatan</div></div>
  </div>
  <div class="section-label">Detail Denda</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Buku</th><th>Anggota</th><th>Jatuh Tempo</th><th>Tgl Kembali</th><th>Terlambat</th><th>Denda</th></tr></thead>
      <tbody id="dendaTable"><tr><td colspan="6" class="empty-state"><div class="icon">💰</div>Memuat...</td></tr></tbody>
    </table>
  </div>
</main>
<script>
requireAuth();
renderNav('denda');
function fmt(d){return d?new Date(d).toLocaleDateString('id-ID'):'-';}
function fmtRp(n){return 'Rp '+Number(n||0).toLocaleString('id-ID');}
function daysDiff(a,b){return Math.ceil((new Date(b)-new Date(a))/86400000);}

async function init(){
  try{
    const{data}=await apiCall('GET','/loans');
    const total=data.reduce((s,l)=>s+Number(l.fine||0),0);
    const overdue=data.filter(l=>l.status==='overdue').length;
    document.getElementById('dendaTotal').textContent=fmtRp(total);
    document.getElementById('dendaOverdue').textContent=overdue;
    const rows=data.filter(l=>l.fine>0||l.status==='overdue');
    const tb=document.getElementById('dendaTable');
    if(!rows.length){tb.innerHTML='<tr><td colspan="6" class="empty-state"><div class="icon">💰</div>Tidak ada denda</td></tr>';return;}
    tb.innerHTML=rows.map(l=>{
      const due=(l.due_date||'').split('T')[0];
      const ret=l.return_date?(l.return_date||'').split('T')[0]:null;
      const today=new Date().toISOString().split('T')[0];
      const late=Math.max(0,daysDiff(due,ret||today));
      const fine=l.fine>0?l.fine:late*1000;
      return `<tr>
        <td><strong>${l.book_title||'Buku #'+l.book_id}</strong></td>
        <td>${l.member_name||'Anggota #'+l.member_id}</td>
        <td>${fmt(due)}</td>
        <td>${ret?fmt(ret):'<span style="color:var(--red)">Belum kembali</span>'}</td>
        <td style="color:var(--red)">${late} hari</td>
        <td style="color:var(--red);font-weight:600">${fmtRp(fine)}</td>
      </tr>`;
    }).join('');
  }catch(e){toast(e.message,'error');}
}
init();
</script>
</body>
</html>
