<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku - Perpustakaan</title>
<script src="/nav.js"></script>
<script>document.write(sharedCSS);</script>
</head>
<body>
<nav id="mainNav"></nav>
<main>
  <div class="page-header">
    <div class="page-title">Koleksi <span>Buku</span></div>
    <div id="adminActions"></div>
  </div>
  <div class="toolbar">
    <input type="text" id="searchBook" placeholder="Cari judul, pengarang..." oninput="filterBooks()">
    <select id="filterRak" onchange="filterBooks()"><option value="">Semua Rak</option></select>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Judul</th><th>Pengarang</th><th>Kode Buku</th><th>Rak</th><th>Stok</th><th id="aksiHead"></th></tr></thead>
      <tbody id="booksTable"><tr><td colspan="6" class="empty-state"><div class="icon">📖</div>Memuat...</td></tr></tbody>
    </table>
  </div>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Tambah Buku</div>
    <input type="hidden" id="editId">
    <div class="form-row">
      <div class="form-group"><label>Judul</label><input id="fTitle" placeholder="Judul buku"></div>
      <div class="form-group"><label>Pengarang</label><input id="fAuthor" placeholder="Nama pengarang"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Kode Buku</label><input id="fIsbn" placeholder="Contoh: BK-001"></div>
      <div class="form-group"><label>Stok</label><input id="fStock" type="number" min="0" value="0"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Rak</label><select id="fRak"><option value="">-- Pilih Rak --</option></select></div>
      <div class="form-group"><label>Tahun Terbit</label><input id="fYear" type="number" placeholder="2024"></div>
    </div>
    <div class="form-group"><label>Deskripsi</label><textarea id="fDesc" placeholder="Deskripsi singkat..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="submitForm()">Simpan</button>
    </div>
  </div>
</div>

<script>
requireAuth();
renderNav('books');
let allBooks=[];

if(isAdmin()){
  document.getElementById('adminActions').innerHTML='<button class="btn btn-primary" onclick="openModal(null)">+ Tambah Buku</button>';
  document.getElementById('aksiHead').textContent='Aksi';
}

function getRak(){try{return JSON.parse(localStorage.getItem('rak_list')||'[]');}catch{return[];}}

function populateRakFilter(){
  const rak=getRak();
  document.getElementById('filterRak').innerHTML='<option value="">Semua Rak</option>'+rak.map(r=>`<option value="${r.name}">${r.name}</option>`).join('');
  document.getElementById('fRak').innerHTML='<option value="">-- Pilih Rak --</option>'+rak.map(r=>`<option value="${r.name}">${r.name}</option>`).join('');
}

async function loadBooks(){
  try{const{data}=await apiCall('GET','/books');allBooks=data;renderBooks(data);}
  catch(e){toast(e.message,'error');}
}

function renderBooks(books){
  const tb=document.getElementById('booksTable');
  if(!books.length){tb.innerHTML='<tr><td colspan="6" class="empty-state"><div class="icon">📖</div>Belum ada buku</td></tr>';return;}
  tb.innerHTML=books.map(b=>`<tr>
    <td><strong>${b.title}</strong>${b.description?`<div style="font-size:.74rem;color:var(--text-muted)">${b.description}</div>`:''}</td>
    <td>${b.author}</td>
    <td style="color:var(--text-muted);font-size:.78rem;font-family:monospace">${b.isbn}</td>
    <td>${b.category?`<span style="font-size:.76rem;color:var(--gold)">${b.category}</span>`:'-'}</td>
    <td><span style="color:${b.stock>0?'var(--green)':'var(--red)'};font-weight:500">${b.stock}</span></td>
    <td>${isAdmin()?`<div style="display:flex;gap:5px">
      <button class="btn btn-edit btn-sm" onclick="openModal(${b.id})">Edit</button>
      <button class="btn btn-danger btn-sm" onclick="deleteBook(${b.id})">Hapus</button>
    </div>`:''}</td>
  </tr>`).join('');
}

function filterBooks(){
  const q=document.getElementById('searchBook').value.toLowerCase();
  const rak=document.getElementById('filterRak').value;
  renderBooks(allBooks.filter(b=>(!q||(b.title+b.author).toLowerCase().includes(q))&&(!rak||b.category===rak)));
}

function openModal(id){
  populateRakFilter();
  document.getElementById('editId').value=id||'';
  if(id){
    const b=allBooks.find(x=>x.id===id);
    document.getElementById('modalTitle').textContent='Edit Buku';
    document.getElementById('fTitle').value=b.title;
    document.getElementById('fAuthor').value=b.author;
    document.getElementById('fIsbn').value=b.isbn;
    document.getElementById('fStock').value=b.stock;
    document.getElementById('fRak').value=b.category||'';
    document.getElementById('fYear').value=b.year||'';
    document.getElementById('fDesc').value=b.description||'';
  } else {
    document.getElementById('modalTitle').textContent='Tambah Buku Baru';
    ['fTitle','fAuthor','fIsbn','fYear','fDesc'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('fStock').value='0';
    document.getElementById('fRak').value='';
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');}

async function submitForm(){
  const editId=document.getElementById('editId').value;
  const body={
    title:document.getElementById('fTitle').value,
    author:document.getElementById('fAuthor').value,
    isbn:document.getElementById('fIsbn').value,
    stock:Number(document.getElementById('fStock').value)||0,
    category:document.getElementById('fRak').value||null,
  };
  try{
    if(editId){await apiCall('PUT','/books/'+editId,body);toast('Buku diupdate!');}
    else{await apiCall('POST','/books',body);toast('Buku ditambahkan!');}
    closeModal();loadBooks();
  }catch(e){toast(e.message,'error');}
}

async function deleteBook(id){
  if(!confirm('Hapus buku ini?')) return;
  try{await apiCall('DELETE','/books/'+id);toast('Buku dihapus');loadBooks();}
  catch(e){toast(e.message,'error');}
}

populateRakFilter();
loadBooks();
</script>
</body>
</html>
