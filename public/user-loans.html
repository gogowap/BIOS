<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peminjaman Saya - Perpustakaan</title>
<script src="/nav.js"></script>
<script>document.write(sharedCSS);</script>
<style>
.info-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;font-size:.85rem;color:var(--text-muted);display:flex;align-items:center;gap:10px;}
.info-box strong{color:var(--text);}
</style>
</head>
<body>
<nav id="mainNav"></nav>
<main>
  <div class="page-header">
    <div class="page-title">Peminjaman <span>Saya</span></div>
  </div>
  <div class="info-box" id="infoBox">
    📋 Menampilkan riwayat peminjaman atas nama: <strong id="memberNameInfo">—</strong>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Buku</th><th>Tgl Pinjam</th><th>Jatuh Tempo</th><th>Tgl Kembali</th><th>Status</th><th>Denda</th></tr></thead>
      <tbody id="loansTable"><tr><td colspan="6" class="empty-state"><div class="icon">🔄</div>Memuat...</td></tr></tbody>
    </table>
  </div>
</main>
<script>
requireAuth();
if(isAdmin()) window.location.href='/loans.html';
renderNav('user-loans');

const LABEL={borrowed:'Dipinjam',returned:'Dikembalikan',overdue:'Terlambat'};
function fmt(d){return d?new Date(d).toLocaleDateString('id-ID'):'-';}
function fmtRp(n){return 'Rp '+Number(n||0).toLocaleString('id-ID');}

async function init(){
  const user=getUser();
  try{
    // Ambil semua loans dan members
    const [loansRes, membersRes] = await Promise.all([
      apiCall('GET','/loans'),
      apiCall('GET','/members')
    ]);

    // Cari member yang cocok dengan user yang login (by email atau nama)
    const member = membersRes.data.find(m =>
      m.email === user.email || m.name === user.name
    );

    const tb=document.getElementById('loansTable');

    if(!member){
      document.getElementById('infoBox').innerHTML='⚠️ Kamu belum terdaftar sebagai anggota perpustakaan. Hubungi admin untuk mendaftarkan dirimu.';
      tb.innerHTML='<tr><td colspan="6" class="empty-state"><div class="icon">👤</div>Belum terdaftar sebagai anggota</td></tr>';
      return;
    }

    document.getElementById('memberNameInfo').textContent = member.name;

    // Filter: hanya tampilkan pinjaman milik member ini
    const myLoans = loansRes.data.filter(l => l.member_id === member.id);

    if(!myLoans.length){
      tb.innerHTML='<tr><td colspan="6" class="empty-state"><div class="icon">🔄</div>Belum ada riwayat peminjaman</td></tr>';
      return;
    }

    tb.innerHTML=myLoans.map(l=>`<tr>
      <td><strong>${l.book_title||'Buku #'+l.book_id}</strong></td>
      <td style="color:var(--text-muted)">${fmt(l.loan_date)}</td>
      <td style="color:var(--text-muted)">${fmt(l.due_date)}</td>
      <td style="color:var(--text-muted)">${l.return_date?fmt(l.return_date):'-'}</td>
      <td><span class="badge badge-${l.status}">${LABEL[l.status]||l.status}</span></td>
      <td style="color:${l.fine>0?'var(--red)':'var(--text-muted)'}">${l.fine>0?fmtRp(l.fine):'-'}</td>
    </tr>`).join('');

  }catch(e){toast(e.message,'error');}
}

init();
</script>
</body>
</html>
