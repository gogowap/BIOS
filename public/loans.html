<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peminjaman - Perpustakaan</title>
<script src="/nav.js"></script>
<script>document.write(sharedCSS);</script>
</head>
<body>
<nav id="mainNav"></nav>
<main>
  <div class="page-header">
    <div class="page-title">Data <span>Peminjaman</span></div>
    <button class="btn btn-primary" onclick="openLoanModal()">+ Pinjam Buku</button>
  </div>
  <div class="toolbar">
    <select id="filterStatus" onchange="filterLoans()">
      <option value="">Semua Status</option>
      <option value="borrowed">Dipinjam</option>
      <option value="overdue">Terlambat</option>
      <option value="returned">Dikembalikan</option>
    </select>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Buku</th><th>Anggota</th><th>Tgl Pinjam</th><th>Jatuh Tempo</th><th>Status</th><th>Denda</th><th>Aksi</th></tr></thead>
      <tbody id="loansTable"><tr><td colspan="7" class="empty-state"><div class="icon">🔄</div>Memuat...</td></tr></tbody>
    </table>
  </div>
</main>

<!-- MODAL PINJAM -->
<div class="modal-overlay" id="modalLoan">
  <div class="modal">
    <div class="modal-title">Pinjam Buku</div>
    <div class="form-group"><label>Pilih Buku</label><select id="loanBook"><option value="">-- Pilih Buku --</option></select></div>
    <div class="form-group"><label>Pilih Anggota</label><select id="loanMember"><option value="">-- Pilih Anggota --</option></select></div>
    <div style="font-size:.79rem;color:var(--text-muted);margin-top:4px">⏱ Durasi: <strong>7 hari</strong> &nbsp;|&nbsp; 💸 Denda: <strong>Rp 1.000/hari</strong></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeLoanModal()">Batal</button>
      <button class="btn btn-primary" onclick="submitLoan()">Pinjam</button>
    </div>
  </div>
</div>

<!-- MODAL KEMBALI -->
<div class="modal-overlay" id="modalReturn">
  <div class="modal">
    <div class="modal-title">Konfirmasi Pengembalian</div>
    <input type="hidden" id="returnId">
    <div id="returnPreview" class="fine-preview"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeReturnModal()">Batal</button>
      <button class="btn btn-primary" onclick="confirmReturn()">✓ Konfirmasi</button>
    </div>
  </div>
</div>

<script>
requireAuth();
renderNav('loans');
let allLoans=[];
const LABEL={borrowed:'Dipinjam',returned:'Dikembalikan',overdue:'Terlambat'};
function fmt(d){return d?new Date(d).toLocaleDateString('id-ID'):'-';}
function fmtRp(n){return 'Rp '+Number(n||0).toLocaleString('id-ID');}
function daysDiff(a,b){return Math.ceil((new Date(b)-new Date(a))/86400000);}

async function loadLoans(){
  try{const{data}=await apiCall('GET','/loans');allLoans=data;renderLoans(data);}
  catch(e){toast(e.message,'error');}
}

function renderLoans(loans){
  const tb=document.getElementById('loansTable');
  if(!loans.length){tb.innerHTML='<tr><td colspan="7" class="empty-state"><div class="icon">🔄</div>Belum ada peminjaman</td></tr>';return;}
  tb.innerHTML=loans.map(l=>`<tr>
    <td><strong>${l.book_title||'Buku #'+l.book_id}</strong></td>
    <td>${l.member_name||'Anggota #'+l.member_id}</td>
    <td style="color:var(--text-muted)">${fmt(l.loan_date)}</td>
    <td style="color:var(--text-muted)">${fmt(l.due_date)}</td>
    <td><span class="badge badge-${l.status}">${LABEL[l.status]||l.status}</span></td>
    <td style="color:${l.fine>0?'var(--red)':'var(--text-muted)'}">${l.fine>0?fmtRp(l.fine):'-'}</td>
    <td>${l.status!=='returned'?`<button class="btn btn-return btn-sm" onclick="openReturn(${l.id})">↩ Kembali</button>`:'-'}</td>
  </tr>`).join('');
}

function filterLoans(){
  const st=document.getElementById('filterStatus').value;
  renderLoans(st?allLoans.filter(l=>l.status===st):allLoans);
}

async function openLoanModal(){
  try{
    const[books,members]=await Promise.all([apiCall('GET','/books'),apiCall('GET','/members')]);
    document.getElementById('loanBook').innerHTML='<option value="">-- Pilih Buku --</option>'+books.data.filter(b=>b.stock>0).map(b=>`<option value="${b.id}">${b.title} (stok: ${b.stock})</option>`).join('');
    document.getElementById('loanMember').innerHTML='<option value="">-- Pilih Anggota --</option>'+members.data.filter(m=>m.status==='active').map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
    document.getElementById('modalLoan').classList.add('open');
  }catch(e){toast(e.message,'error');}
}
function closeLoanModal(){document.getElementById('modalLoan').classList.remove('open');}

async function submitLoan(){
  const book_id=document.getElementById('loanBook').value;
  const member_id=document.getElementById('loanMember').value;
  if(!book_id||!member_id){toast('Pilih buku dan anggota','error');return;}
  try{
    await apiCall('POST','/loans',{book_id:Number(book_id),member_id:Number(member_id)});
    toast('Peminjaman berhasil!');closeLoanModal();loadLoans();
  }catch(e){toast(e.message,'error');}
}

function openReturn(id){
  const l=allLoans.find(x=>x.id===id); if(!l) return;
  document.getElementById('returnId').value=id;
  const today=new Date().toISOString().split('T')[0];
  const due=(l.due_date||'').split('T')[0];
  const late=Math.max(0,daysDiff(due,today));
  const fine=late*1000;
  document.getElementById('returnPreview').innerHTML=`
    <div class="fine-row"><span>Buku</span><strong>${l.book_title||'Buku #'+l.book_id}</strong></div>
    <div class="fine-row"><span>Peminjam</span><strong>${l.member_name||'Anggota #'+l.member_id}</strong></div>
    <div class="fine-row"><span>Jatuh Tempo</span><span>${fmt(due)}</span></div>
    <div class="fine-row"><span>Keterlambatan</span><span style="color:${late>0?'var(--red)':'var(--green)'}">${late} hari</span></div>
    <div class="fine-row"><span>Denda</span><span style="color:${fine>0?'var(--red)':'var(--green)'}">${fine>0?fmtRp(fine):'Tidak ada denda ✓'}</span></div>
  `;
  document.getElementById('modalReturn').classList.add('open');
}
function closeReturnModal(){document.getElementById('modalReturn').classList.remove('open');}

async function confirmReturn(){
  const id=document.getElementById('returnId').value;
  try{
    const{message}=await apiCall('PUT','/loans/'+id+'/return');
    toast(message||'Buku berhasil dikembalikan');
    closeReturnModal();loadLoans();
  }catch(e){toast(e.message,'error');}
}

loadLoans();
</script>
</body>
</html>
