<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Aktivitas - Perpustakaan</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/nav/nav.css">
    <link rel="stylesheet" href="log-aktivitas.css">
</head>

<body>

    <nav id="mainNav"></nav>

    <main>
        <div class="page-header">
            <div class="page-title">Riwayat <span>Aktivitas</span></div>
            <div style="display:flex;gap:8px;align-items:center">
                <select class="filter-sel" id="filterAction" onchange="filterLogs()">
                    <option value="">Semua Aksi</option>
                    <option value="TAMBAH_BUKU">Tambah Buku</option>
                    <option value="EDIT_BUKU">Edit Buku</option>
                    <option value="HAPUS_BUKU">Hapus Buku</option>
                    <option value="TAMBAH_ANGGOTA">Tambah Anggota</option>
                    <option value="EDIT_ANGGOTA">Edit Anggota</option>
                    <option value="HAPUS_ANGGOTA">Hapus Anggota</option>
                    <option value="PINJAM_BUKU">Pinjam Buku</option>
                    <option value="KEMBALI_BUKU">Kembali Buku</option>
                </select>
                <button class="btn btn-ghost" onclick="loadLogs()">↻ Refresh</button>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Waktu</th>
                        <th>Pelaku</th>
                        <th>Aksi</th>
                        <th>Target</th>
                        <th>Detail</th>
                    </tr>
                </thead>
                <tbody id="logTable">
                    <tr>
                        <td colspan="5" class="empty-state">
                            <div class="icon">📋</div>Memuat...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="/nav/nav.js"></script>
    <script src="log-aktivitas.js"></script>
    <script>
        renderNav('aktivitas');
    </script>
</body>

</html>
