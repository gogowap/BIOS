<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beranda - Perpustakaan</title>
<script src="/nav.js"></script>
<script>document.write(sharedCSS);</script>
</head>
<body>
<nav id="mainNav"></nav>
<main>
  <div class="page-header">
    <div>
      <div class="page-title">Halo, <span id="userName">—</span>!</div>
      <div style="color:var(--text-muted);font-size:.83rem;margin-top:4px">Selamat datang di perpustakaan digital</div>
    </div>
  </div>
  <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
    <div class="stat-card"><div class="stat-label">Total Buku</div><div class="stat-value" id="statBooks">—</div><div class="stat-sub">tersedia di perpustakaan</div></div>
    <div class="stat-card"><div class="stat-label">Total Rak</div><div class="stat-value" id="statRak">—</div><div class="stat-sub">kategori buku</div></div>
    <div class="stat-card"><div class="stat-label">Buku Tersedia</div><div class="stat-value" id="statAvail">—</div><div class="stat-sub">stok > 0</div></div>
  </div>
  <div class="section-label">Buku Terbaru</div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Judul</th><th>Pengarang</th><th>Rak</th><th>Stok</th></tr></thead>
      <tbody id="recentBooks"><tr><td colspan="4" class="empty-state">Memuat...</td></tr></tbody>
    </table>
  </div>
</main>
<script>
requireAuth();
// Redirect admin ke dashboard
if(isAdmin()) window.location.href='/dashboard.html';
renderNav('user-home');

const user=getUser();
document.getElementById('userName').textContent=user.name||'Pengguna';

async function init(){
  try{
    const{data}=await apiCall('GET','/books');
    document.getElementById('statBooks').textContent=data.length;
    document.getElementById('statAvail').textContent=data.filter(b=>b.stock>0).length;
    const rak=JSON.parse(localStorage.getItem('rak_list')||'[]');
    document.getElementById('statRak').textContent=rak.length;
    const tb=document.getElementById('recentBooks');
    const rows=data.slice(0,8);
    if(!rows.length){tb.innerHTML='<tr><td colspan="4" class="empty-state">Belum ada buku</td></tr>';return;}
    tb.innerHTML=rows.map(b=>`<tr>
      <td><strong>${b.title}</strong>${b.description?`<div style="font-size:.74rem;color:var(--text-muted)">${b.description}</div>`:''}</td>
      <td>${b.author}</td>
      <td>${b.category?`<span style="font-size:.76rem;color:var(--gold)">${b.category}</span>`:'-'}</td>
      <td><span style="color:${b.stock>0?'var(--green)':'var(--red)'}">${b.stock>0?b.stock+' tersedia':'Habis'}</span></td>
    </tr>`).join('');
  }catch(e){toast(e.message,'error');}
}
init();
</script>
</body>
</html>
